# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release des Update-Managers. Wirkt NUR im oeffentlichen Repo
# MelucioLabs/update-manager: Dort liegt diese Datei als
# .github/workflows/release.yml. Im Monorepo steht sie unter
# automation/update-manager/.github/ und wird von GitHub nicht beachtet
# (Workflows zaehlen nur im .github/ der Repo-Wurzel).
#
# Ablauf: Entweder ein Sync-Lauf pusht einen neuen Stand auf main (Regelfall
# seit dem 26.11.2026: JEDER Spiegel-Stand bekommt sein eigenes Release), oder
# ein Tag v3.2.0 wird gesetzt und gepusht, oder der Lauf startet von Hand.
# Der Lauf
#   1. bestimmt die Version: bei einem Tag wird geprueft, dass er zu
#      $UpdaterVersion in BEIDEN Skripten passt; nach einem Sync zaehlt der
#      Lauf die letzte releaste Version selbst hoch und hebt $UpdaterVersion
#      in beiden Skripten fuer den Bau an (siehe Schritt "Version ..."),
#   2. faehrt die Bausteinprobe (probe.ps1) unter Windows PowerShell 5.1,
#   3. prueft das Linux-Skript (bash -n, test.sh, shellcheck),
#   4. baut das Setup mit Inno Setup,
#   5. signiert es ueber die SignPath Foundation (Schalter SIGNPATH_AKTIV, aus),
#   6. legt ein Release an: Setup, Pruefsumme, Linux-Skript.
#
# Hintergrund des Auto-Releases (Feldtest 26.11.2026): Der Spiegel-Lauf im
# Monorepo pusht nur Commits, nie Tags. Der Feldtester installierte am
# Vormittag die Fassung v3.3.5, die MERGES aus einem spaeteren Sync fehlten —
# der Tester sah die neuen Features als kaputt, weil sie ihm schlicht fehlten.
# Seitdem erzeugt jeder Stand auf main sein Release aus sich heraus.
#
# Auf einem Zweig (workflow_dispatch ohne main) bleibt es beim alten Schema:
# Version mit -dev als Anhängsel, Artefakt statt Release — zum Probelauf.

name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Sync-Laeufe koennen dicht aufeinander folgen (mehrere Merges am Ende eines
# Prueftags). Ohne Serie wuerden zwei Laeufe dieselbe naechste Version
# berechnen und das zweite Release gescheitert neu versuchen — Reihen ohne
# Abbruch stellen die Versionen stattdessen einfach hintereinander bereit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux-Skript pruefen
        working-directory: linux
        run: |
          bash -n update-manager.sh
          bash test.sh
          shellcheck update-manager.sh test.sh

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version aus Tag und Skripten abgleichen
        id: version
        shell: pwsh
        run: |
          function Nenne-Version([string]$Text) {
              # "3.3.5" -> [version], alles andere = $null (Fehler folgt).
              if ($Text -notmatch '^\d+\.\d+\.\d+$') { return $null }
              try { return [version]$Text } catch { return $null }
          }

          $inSkripten = foreach ($f in 'universal-update-manager.ps1', 'update-manager-gui.ps1') {
              $m = Select-String -Path $f -Pattern "^\`$UpdaterVersion\s*=\s*'([^']+)'" | Select-Object -First 1
              if (-not $m) { throw "$f traegt keine Zeile `$UpdaterVersion = '...'" }
              $m.Matches[0].Groups[1].Value
          }
          $inSkripten = @($inSkripten | Select-Object -Unique)
          if ($inSkripten.Count -ne 1) { throw "Die Skripte nennen verschiedene Versionen: $($inSkripten -join ', ')" }
          $version = $inSkripten[0]
          $tag = ''
          if ('${{ github.ref_type }}' -eq 'tag') {
              # v3.2.0 oder v3.2.0-rc1: der Teil vor dem Bindestrich muss passen.
              $ref = '${{ github.ref_name }}'
              $ausTag = $ref.TrimStart('v').Split('-')[0]
              if ($ausTag -ne $version) { throw "Tag $ref passt nicht zu `$UpdaterVersion = '$version'" }
              $tag = $ref
          } elseif ('${{ github.ref }}' -eq 'refs/heads/main') {
              # Jeder Spiegel-Stand ist es wert, releast zu werden (Feldtest
              # 26.11.2026): Der Sync pusht nur Commits, und ein Stand ohne
              # neuen Tag blieb sonst ohne Release.
              #
              # Liegt die Skript-Version schon als Tag vor, zaehlt dieser Lauf
              # die kleine Version hoch und hebt `$UpdaterVersion in beiden
              # Skripten fuer den Bau an — nicht als Commit: main bleibt die
              # reine Abbildung des Monorepo-Stands, versionsdrahtig wird nur
              # der Bau (und mit ihm das Setup, dessen installierter Manager
              # die Versionsnummer fuer das naechste Selbst-Update vergleicht).
              # Einen Versionsbump im Monorepo (bump-version-PR) wie gehabt:
              # Eilt die Nummer voraus, wird sie direkt benutzt, nicht noch
              # einmal erhoeht.
              $skriptVersion = Nenne-Version $version
              if ($null -eq $skriptVersion) { throw "Skript-Version '$version' ist nicht a.b.c" }
              $vorhandene = @(git ls-remote --tags origin 'v*' | ForEach-Object {
                  (((($_ -split "`t")[1]) -replace 'refs/tags/', '') -replace '\^\{\}$', '').TrimStart('v')
              } | ForEach-Object { Nenne-Version $_ } | Where-Object { $_ } | Sort-Object -Unique)
              $hoechste = if ($vorhandene.Count -gt 0) { $vorhandene[-1] } else { [version]'0.0.0' }
              if ($skriptVersion -gt $hoechste) {
                  # Der Monorepo-Stand traegt schon die naechste Nummer (wie
                  # ein bump-version-PR): genau diese Version releasen.
              } else {
                  $teile = @($hoechste.Major, $hoechste.Minor, [Math]::Max($hoechste.Build, 0))
                  $teile[2] += 1
                  $version = $teile -join '.'
                  foreach ($f in 'universal-update-manager.ps1', 'update-manager-gui.ps1') {
                      $bytes = [IO.File]::ReadAllBytes($f)
                      $hatBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
                      # GetString(mappt die BOM-Bytes AUF U+FEFF, die Flagge
                      # gilt nur beim Schreiben). Ohne Abschneiden landete bei
                      # jedem Anheben ein ZWEITES BOM in der Datei, und Windows
                      # PowerShell 5.1 brach beim Parsen ab - im Setup-Lauf
                      # 45817653148 (26.11.2026) als Parse-Fehler an gui.ps1:49.
                      $text = [Text.UTF8Encoding]::new($false).GetString($bytes)
                      if ($hatBom -and $text.Length -gt 0 -and [int]$text[0] -eq 0xFEFF) { $text = $text.Substring(1) }
                      $neu = [regex]::Replace($text, "(?m)^(\`$UpdaterVersion\s*=\s*')[^']+(')", "`${1}$version`$2")
                      if ($neu -ceq $text) { throw "${f}: `$UpdaterVersion ließ sich nicht auf $version anheben" }
                      [IO.File]::WriteAllText((Resolve-Path $f), $neu, [Text.UTF8Encoding]::new($hatBom))
                  }
                  echo "::notice title=Version angehoben::Tag v$hoechste existierte schon; der Spiegel-Stand wird als v$version releast."
              }
              $tag = "v$version"
          } else {
              $version = "$version-dev"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # Rein numerisch (a.b.c.d) fuer die Versionsinfo der Setup-Datei.
          $num = @($version.Split('-')[0].Split('.'))
          while ($num.Count -lt 4) { $num += '0' }
          "versionnum=$($num[0..3] -join '.')" >> $env:GITHUB_OUTPUT
          "Version: $version (Tag: $tag)"

      - name: Bausteinprobe (Windows PowerShell 5.1)
        shell: powershell
        run: .\probe.ps1

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Setup bauen
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" "/DAppVersionNum=${{ steps.version.outputs.versionnum }}" installer\update-manager.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ist mit $LASTEXITCODE gescheitert" }
          Get-ChildItem dist

      # --- Signieren ueber die SignPath Foundation -------------------------
      # AUS, bis die Foundation das Projekt aufgenommen hat. Einschalten:
      # Repository-Variable SIGNPATH_AKTIV = true (Settings > Secrets and
      # variables > Actions > Variables), dazu das Secret SIGNPATH_API_TOKEN
      # und die Variablen SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_SIGNING_POLICY_SLUG (die Werte stammen aus dem SignPath-Konto).
      # Anleitung und Antragsliste: im Monorepo docs/update-manager-signpath-antrag.md.
      # Nur Tag-Laeufe werden signiert; JEDES Release braucht die Freigabe von
      # Hand in SignPath, der Lauf wartet darauf (bis 60 Minuten).
      # Bedingungen: https://signpath.org/terms
      # Action:      https://docs.signpath.io/trusted-build-systems/github
      # Artefakt-Konfiguration: .signpath/artifact-configuration.xml
      - name: Unsigniertes Setup als Artefakt
        id: unsigniert
        if: github.ref_type == 'tag' && vars.SIGNPATH_AKTIV == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup-unsigniert
          path: dist/update-manager-setup.exe
          if-no-files-found: error

      - name: Signieren ueber SignPath
        if: github.ref_type == 'tag' && vars.SIGNPATH_AKTIV == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigniert.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signiert
          parameters: |
            version: "${{ steps.version.outputs.version }}"
            productversion: "${{ steps.version.outputs.versionnum }}"

      - name: Signiertes Setup uebernehmen und Signatur pruefen
        if: github.ref_type == 'tag' && vars.SIGNPATH_AKTIV == 'true'
        shell: pwsh
        run: |
          $signiert = @(Get-ChildItem signiert -Filter 'update-manager-setup.exe' -Recurse)
          if ($signiert.Count -ne 1) { throw "Erwartet genau ein signiertes Setup, gefunden: $($signiert.Count)" }
          Copy-Item $signiert[0].FullName dist\ -Force
          $datei = Join-Path dist $signiert[0].Name
          $s = Get-AuthenticodeSignature $datei
          if ($s.Status -ne 'Valid') { throw "Signatur: $($s.Status)" }
          if ($s.SignerCertificate.Subject -notmatch '(^|, )CN=SignPath Foundation(,|$)') {
              throw "Unerwarteter Aussteller: $($s.SignerCertificate.Subject)"
          }
          "Signiert von: $($s.SignerCertificate.Subject)"
      # ---------------------------------------------------------------------

      # Feste Adresse fuer die Seite meluciolabs.de/update und fuer das
      # Selbst-Update: GitHub liefert unter .../releases/latest/download/<Name>
      # immer die Datei der neuesten Fassung, aber nur bei gleichbleibendem
      # Namen. Der Bau heisst die Datei deshalb fest update-manager-setup.exe
      # (installer/update-manager.iss, OutputBaseFilename); die Version steht
      # im Release-Tag und in den Datei-Eigenschaften, nicht im Namen.

      - name: Pruefsumme
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File -Encoding ascii -Append dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - name: Release anlegen
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bei einem Sync-Lauf legt gh release create zugleich den neuen Tag
          # an, und zwar am Commit, der gerade gebaut wurde. Bei einem Tag-
          # Lauf ist der Tag schon da.
          $tag = '${{ steps.version.outputs.tag }}'
          $dateien = @(Get-ChildItem dist\*.exe | ForEach-Object FullName) + 'dist\SHA256SUMS.txt' + 'linux\update-manager.sh'
          # Kopf der Release-Notizen (GitHub haengt die Liste der Aenderungen an).
          $notizen = @(
              'Setup fuer Windows 10 und 11: update-manager-setup.exe.',
              'Die Pruefsumme steht in SHA256SUMS.txt; vergleichen mit: Get-FileHash <Datei> -Algorithm SHA256',
              'Das Setup ist noch nicht signiert, Windows SmartScreen zeigt deshalb eine Warnung. Anleitung: https://meluciolabs.de/update',
              'Linux: update-manager.sh. Lizenz: GPL-3.0-or-later.'
          ) -join "`n"
          $argumente = @('release', 'create', $tag) + $dateien + @('--title', "Update-Manager $tag", '--notes', $notizen, '--generate-notes')
          # v3.2.0-rc1 und Verwandte: Vorabfassung. Die bekommt das
          # Selbst-Update nicht (releases/latest liefert keine Vorabfassungen).
          if ($tag -match '-') { $argumente += '--prerelease' }
          gh @argumente
          if ($LASTEXITCODE -ne 0) { throw "gh release create ist gescheitert" }

      - name: Setup als Artefakt (Zweig, kein Release)
        if: github.ref_type != 'tag' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ steps.version.outputs.version }}
          path: dist/*
