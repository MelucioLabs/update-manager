# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release des Update-Managers. Wirkt NUR im oeffentlichen Repo
# MelucioLabs/update-manager: Dort liegt diese Datei als
# .github/workflows/release.yml. Im Monorepo steht sie unter
# automation/update-manager/.github/ und wird von GitHub nicht beachtet
# (Workflows zaehlen nur im .github/ der Repo-Wurzel).
#
# Ablauf: Tag v3.2.0 im oeffentlichen Repo setzen und pushen. Der Lauf
#   1. prueft, dass der Tag zu $UpdaterVersion in BEIDEN Skripten passt,
#   2. faehrt die Bausteinprobe (probe.ps1) unter Windows PowerShell 5.1,
#   3. prueft das Linux-Skript (bash -n, test.sh, shellcheck),
#   4. baut das Setup mit Inno Setup,
#   5. (spaeter) signiert es ueber die SignPath Foundation,
#   6. legt ein Release an: Setup, Pruefsumme, Linux-Skript.
#
# UNGETESTET: geschrieben ohne Windows-Rechner und ohne das Ziel-Repo. Der
# erste Tag ist deshalb am besten ein Probe-Tag (z. B. v3.2.0-rc1), das
# Release danach von Hand loeschen.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux-Skript pruefen
        working-directory: linux
        run: |
          bash -n update-manager.sh
          bash test.sh
          shellcheck update-manager.sh test.sh

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version aus Tag und Skripten abgleichen
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          $inSkripten = foreach ($f in 'universal-update-manager.ps1', 'update-manager-gui.ps1') {
              $m = Select-String -Path $f -Pattern "^\`$UpdaterVersion\s*=\s*'([^']+)'" | Select-Object -First 1
              if (-not $m) { throw "$f traegt keine Zeile `$UpdaterVersion = '...'" }
              $m.Matches[0].Groups[1].Value
          }
          $inSkripten = @($inSkripten | Select-Object -Unique)
          if ($inSkripten.Count -ne 1) { throw "Die Skripte nennen verschiedene Versionen: $($inSkripten -join ', ')" }
          $version = $inSkripten[0]
          if ('${{ github.ref_type }}' -eq 'tag') {
              # v3.2.0 oder v3.2.0-rc1: der Teil vor dem Bindestrich muss passen.
              $ausTag = $ref.TrimStart('v').Split('-')[0]
              if ($ausTag -ne $version) { throw "Tag $ref passt nicht zu `$UpdaterVersion = '$version'" }
              $version = $ref.TrimStart('v')
          } else {
              $version = "$version-dev"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Version: $version"

      - name: Bausteinprobe (Windows PowerShell 5.1)
        shell: powershell
        run: .\probe.ps1

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Setup bauen
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" installer\update-manager.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ist mit $LASTEXITCODE gescheitert" }
          Get-ChildItem dist

      # --- Signieren (noch nicht aktiv) ------------------------------------
      # Sobald die SignPath Foundation das Projekt aufgenommen hat:
      #   https://signpath.org/            (Antrag fuer Open-Source-Projekte)
      #   https://docs.signpath.io/trusted-build-systems/github
      # Dann: unsigniertes Setup als Artefakt hochladen, SignPath signiert
      # es und liefert es zurueck, danach wird das signierte hochgeladen.
      # Secret SIGNPATH_API_TOKEN und die IDs kommen von SignPath.
      #
      # - name: Unsigniertes Setup als Artefakt
      #   id: unsigniert
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: setup-unsigniert
      #     path: dist/*.exe
      #
      # - name: Signieren ueber SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: '<von SignPath>'
      #     project-slug: 'update-manager'
      #     signing-policy-slug: 'release-signing'
      #     github-artifact-id: ${{ steps.unsigniert.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist
      #
      # - name: Signatur pruefen
      #   shell: pwsh
      #   run: |
      #     $s = Get-AuthenticodeSignature (Get-ChildItem dist\*.exe).FullName
      #     if ($s.Status -ne 'Valid') { throw "Signatur: $($s.Status)" }
      # ---------------------------------------------------------------------

      # Feste Adresse fuer die Seite meluciolabs.de/update: GitHub liefert
      # unter .../releases/latest/download/<Name> immer die Datei der neuesten
      # Fassung, aber nur bei gleichbleibendem Namen. Das Setup mit Version im
      # Namen bleibt fuer das Selbst-Update, dieses ist dieselbe Datei.
      - name: Setup mit festem Namen
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\MelucioLabs-Update-Manager-Setup-*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist\MelucioLabs-Update-Manager-Setup.exe

      - name: Pruefsumme
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File -Encoding ascii -Append dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - name: Release anlegen
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $dateien = @(Get-ChildItem dist\*.exe | ForEach-Object FullName) + 'dist\SHA256SUMS.txt' + 'linux\update-manager.sh'
          # Kopf der Release-Notizen (GitHub haengt die Liste der Aenderungen an).
          $notizen = @(
              'Setup fuer Windows 10 und 11: MelucioLabs-Update-Manager-Setup.exe (dieselbe Datei wie die mit Version im Namen).',
              'Die Pruefsumme steht in SHA256SUMS.txt; vergleichen mit: Get-FileHash <Datei> -Algorithm SHA256',
              'Das Setup ist noch nicht signiert, Windows SmartScreen zeigt deshalb eine Warnung. Anleitung: https://meluciolabs.de/update',
              'Linux: update-manager.sh. Lizenz: GPL-3.0-or-later.'
          ) -join "`n"
          $argumente = @('release', 'create', $tag) + $dateien + @('--title', "Update-Manager $tag", '--notes', $notizen, '--generate-notes')
          # v3.2.0-rc1 und Verwandte: Vorabfassung. Die bekommt das
          # Selbst-Update nicht (releases/latest liefert keine Vorabfassungen).
          if ($tag -match '-') { $argumente += '--prerelease' }
          gh @argumente
          if ($LASTEXITCODE -ne 0) { throw "gh release create ist gescheitert" }

      - name: Setup als Artefakt (ohne Tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ steps.version.outputs.version }}
          path: dist/*
